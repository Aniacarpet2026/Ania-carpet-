name: Build Ania Carpet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q *.zip -d project
          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -100

      - name: Find Android project
        run: |
          ROOT=$(dirname "$(find project -name settings.gradle.kts -o -name settings.gradle | head -1)")
          echo "ROOT=$ROOT" >> $GITHUB_ENV

      - name: Build APK
        run: |
          gradle -p "$ROOT" -Pkotlin.jvm.target.validation.mode=warning assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ania-Carpet-APK
          path: "${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk"
